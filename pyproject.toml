[project]
name = "enwis-backend"
version = "1.1.0"
description = "Online Examination Platform — Backend API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic[email]>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.10,<3",
    "python-jose[cryptography]>=3.3,<4",
    "redis[hiredis]>=5.2,<6",
    "passlib[argon2]>=1.7.4,<2",
    "bcrypt>=4.0,<4.1",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "itsdangerous>=2.2,<3",
    "google-auth>=2.35,<3",
    "requests>=2.32,<3",
    "resend>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "coverage>=7,<8",
    "anyio>=4.8,<5",
    "aiosqlite>=0.20,<1",
]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["B008", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
